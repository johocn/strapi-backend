# 80端口：仅证书验证 + 全部HTTP强制301跳转HTTPS
server {
    listen 80 ; 
    listen [::]:80 ; 
    server_name h.joho.cn; 
    access_log /www/sites/h.joho.cn/log/access_80.log main; 
    error_log /www/sites/h.joho.cn/log/error_80.log; 
    # SSL证书自动续期验证目录（保留原路径）
    location ^~ /.well-known/acme-challenge {
        allow all; 
        root /usr/share/nginx/html; 
    }
    # 所有http请求永久跳转https
    location / {
        return 301 https://$host$request_uri; 
    }
    root /www/sites/h.joho.cn/index; 
}
# 443 HTTPS 主服务段（修正证书私钥文件名为privkey.key）
server {
    listen 443 ssl http2 ; 
    listen [::]:443 ssl http2 ; 
    server_name h.joho.cn; 
    # 修正：私钥文件后缀为.key，匹配服务器真实文件
    ssl_certificate /www/sites/h.joho.cn/ssl/fullchain.pem; 
    ssl_certificate_key /www/sites/h.joho.cn/ssl/privkey.key; 
    # SSL安全套件
    ssl_protocols TLSv1.2 TLSv1.3; 
    ssl_prefer_server_ciphers on; 
    ssl_session_cache shared:SSL:10m; 
    ssl_session_timeout 10m; 
    ssl_session_tickets off; 
    index index.php index.html index.htm default.php default.htm default.html; 
    root /www/sites/h.joho.cn/index; 
    # 全局统一代理头（完全保留你原有模板）
    proxy_set_header Host $host; 
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
    proxy_set_header X-Forwarded-Host $server_name; 
    proxy_set_header X-Real-IP $remote_addr; 
    proxy_set_header X-Forwarded-Proto $scheme; 
    proxy_http_version 1.1; 
    proxy_set_header Upgrade $http_upgrade; 
    proxy_set_header Connection $http_connection; 
    access_log /www/sites/h.joho.cn/log/access_ssl.log main; 
    error_log /www/sites/h.joho.cn/log/error_ssl.log; 
    # SSL证书自动续期验证目录
    location ^~ /.well-known/acme-challenge {
        allow all; 
        root /usr/share/nginx/html; 
    }
    # SPA前端哈希路由回退
    location / {
        try_files $uri $uri/ /index.html; 
    }
    # Strapi API接口反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:1337/api/; 
        proxy_read_timeout 300s; 
        proxy_send_timeout 300s; 
        client_max_body_size 100m; 
    }
    # Strapi后台管理面板（兼容WebSocket）
    location /admin/ {
        proxy_pass http://127.0.0.1:1337/admin/; 
    }
    # 上传文件静态资源代理
    location /uploads/ {
        proxy_pass http://127.0.0.1:1337/uploads/; 
    }
    # 前端 H5 静态资源优先，未命中回退到 Strapi（zhao-oss 中间件服务 /static/* → public/*）    
    location /static/ {
        root /www/sites/v.joho.cn/index; 
        try_files $uri @strapi_static; 
    }
    # 微信图片代理：绕过 mmbiz.qpic.cn 防盗链（清除 Referer 后转发，前端把 mmbiz 域名替换为 /wximg/）
    location /wximg/ {
        proxy_pass https://mmbiz.qpic.cn/;
        proxy_set_header Host mmbiz.qpic.cn;
        proxy_set_header Referer "";
        proxy_set_header User-Agent "Mozilla/5.0 (iPhone; CPU iPhone OS 15_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148";
        proxy_ssl_server_name on;
        proxy_ssl_name mmbiz.qpic.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
    location @strapi_static {
        proxy_pass http://127.0.0.1:1337; 
        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header X-Forwarded-Host $host; 
        proxy_set_header X-Forwarded-Proto $scheme; 
    }
    error_page 404 /404.html; 
}